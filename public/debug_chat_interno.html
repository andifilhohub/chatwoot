<!DOCTYPE html>
<html>
<head>
    <title>Debug Chat Interno - WebSocket</title>
    <script src="https://unpkg.com/@rails/actioncable@7.0.0/app/assets/javascripts/actioncable.js"></script>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
        .log { padding: 5px; margin: 2px 0; border-left: 3px solid #666; }
        .log.success { border-color: #4caf50; background: #1b5e20; }
        .log.error { border-color: #f44336; background: #b71c1c; }
        .log.info { border-color: #2196f3; background: #0d47a1; }
        .log.warning { border-color: #ff9800; background: #e65100; }
        #logs { height: 400px; overflow-y: auto; background: #2d2d2d; padding: 10px; }
        button { padding: 10px 20px; margin: 5px; font-size: 14px; }
        input { padding: 8px; width: 300px; }
    </style>
</head>
<body>
    <h1>🐛 Debug Chat Interno - WebSocket</h1>
    
    <div>
        <button onclick="connect()">🔌 Conectar</button>
        <button onclick="disconnect()">❌ Desconectar</button>
        <button onclick="checkStatus()">🔍 Verificar Status</button>
        <button onclick="clearLogs()">🗑️ Limpar Logs</button>
    </div>
    
    <div style="margin: 20px 0;">
        <input type="text" id="message" placeholder="Digite uma mensagem...">
        <button onclick="sendMessage()">📤 Enviar</button>
    </div>
    
    <div id="logs"></div>

    <script>
        let cable = null;
        let subscription = null;
        const logsDiv = document.getElementById('logs');
        
        function log(message, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.innerHTML = `[${time}] ${message}`;
            logsDiv.appendChild(div);
            logsDiv.scrollTop = logsDiv.scrollHeight;
            console.log(`[${type}] ${message}`);
        }
        
        function clearLogs() {
            logsDiv.innerHTML = '';
        }
        
        function connect() {
            if (cable) {
                log('⚠️ Já conectado!', 'warning');
                return;
            }
            
            log('🔌 Iniciando conexão...', 'info');
            
            try {
                cable = ActionCable.createConsumer('/cable');
                log('✅ Consumer criado', 'success');
                
                const params = {
                    channel: 'InternalChatChannel',
                    account_id: 1
                };
                
                log(`📋 Parâmetros: ${JSON.stringify(params)}`, 'info');
                
                subscription = cable.subscriptions.create(params, {
                    connected() {
                        log('✅✅✅ CONECTADO ao InternalChatChannel!', 'success');
                        log('Canal ativo: internal_chat_1', 'success');
                    },
                    
                    disconnected() {
                        log('❌ DESCONECTADO', 'error');
                    },
                    
                    rejected() {
                        log('❌❌❌ REJEITADO pelo servidor!', 'error');
                        log('Faça login no Chatwoot primeiro', 'error');
                    },
                    
                    received(data) {
                        log('📨📨📨 MENSAGEM RECEBIDA VIA WEBSOCKET!', 'success');
                        log(`Tipo: ${data.type}`, 'info');
                        log(`Dados: ${JSON.stringify(data, null, 2)}`, 'info');
                        
                        if (data.type === 'new_message' && data.message) {
                            const msg = data.message;
                            log(`🗨️ De: ${msg.sender?.name || 'Unknown'}`, 'success');
                            log(`🗨️ Conteúdo: ${msg.content}`, 'success');
                            log(`🗨️ Room ID: ${msg.room_id}`, 'success');
                        }
                    }
                });
                
                log('⏳ Aguardando confirmação...', 'info');
                
            } catch (error) {
                log(`❌ Erro: ${error.message}`, 'error');
                console.error(error);
            }
        }
        
        function disconnect() {
            if (subscription) {
                subscription.unsubscribe();
                subscription = null;
                log('✅ Unsubscribed', 'info');
            }
            if (cable) {
                cable.disconnect();
                cable = null;
                log('✅ Desconectado', 'info');
            }
        }
        
        function checkStatus() {
            log('🔍 Verificando status...', 'info');
            log(`Cable: ${cable ? 'Criado ✅' : 'Null ❌'}`, cable ? 'success' : 'error');
            log(`Subscription: ${subscription ? 'Ativa ✅' : 'Null ❌'}`, subscription ? 'success' : 'error');
            
            if (cable && cable.connection) {
                const state = cable.connection.getState();
                log(`Estado da conexão: ${state}`, 'info');
            }
        }
        
        function sendMessage() {
            const input = document.getElementById('message');
            const content = input.value.trim();
            
            if (!content) {
                log('⚠️ Digite uma mensagem!', 'warning');
                return;
            }
            
            if (!subscription) {
                log('❌ Não conectado! Clique em Conectar primeiro.', 'error');
                return;
            }
            
            log(`📤 Enviando: "${content}"`, 'info');
            
            const data = {
                content: content,
                room_type: 'general',
                room_id: 'general'
            };
            
            log(`📋 Dados: ${JSON.stringify(data)}`, 'info');
            
            subscription.send(data);
            
            input.value = '';
            log('✅ Enviado via WebSocket', 'success');
        }
        
        // Enter para enviar
        document.getElementById('message').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        // Auto-conectar
        log('🚀 Página carregada', 'info');
        log('👉 Faça login no Chatwoot em outra aba primeiro!', 'warning');
        log('👉 Depois clique em "Conectar"', 'warning');
    </script>
</body>
</html>
